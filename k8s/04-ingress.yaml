# ==============================================================================
# Traefik Ingress for Public Website (/)
# Domain: eshraqatalmustaqbal.com
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-ingress
  namespace: eshraqat
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - eshraqatalmustaqbal.com
        - www.eshraqatalmustaqbal.com
      secretName: eshraqat-tls-secret
  rules:
    - host: eshraqatalmustaqbal.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eshraqat-website
                port:
                  number: 3000
    - host: www.eshraqatalmustaqbal.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eshraqat-website
                port:
                  number: 3000
